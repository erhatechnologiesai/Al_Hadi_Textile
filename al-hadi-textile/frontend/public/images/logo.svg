<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Geometric Weave Emblem -->
  <g transform="translate(4, 6)">
    <!-- Carbon Slate Base Loom Frame -->
    <rect x="2" y="2" width="48" height="48" rx="8" fill="#161B22" />
    
    <!-- Vertical Warp Threads (Slate Accents) -->
    <path d="M14 12V40M22 12V40M30 12V40M38 12V40" stroke="#374151" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Horizontal Weft Shuttle Wave (Vibrant Textile Orange #FF6B00) -->
    <path d="M10 20H42" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" />
    <path d="M10 32H42" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" />
    <circle cx="26" cy="26" r="3.5" fill="#FF6B00" />
    
    <!-- Accent Sparkle / Diamond Knot -->
    <polygon points="46,6 49,9 46,12 43,9" fill="#FF6B00" />
  </g>

  <!-- Typography -->
  <g transform="translate(68, 12)">
    <!-- Brand Title -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#161B22">
      AL HADI
    </text>
    <text x="116" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="300" letter-spacing="1.5" fill="#FF6B00">
      TEXTILES
    </text>

    <!-- Subtitle / Mill Identity -->
    <text x="1" y="38" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3" fill="#6B7280">
      EST. 1994 • EXPORT MILLS & HOME LINENS
    </text>
  </g>
</svg>
